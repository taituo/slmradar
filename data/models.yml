# slmradar model catalog — single source of truth.
# Scope: open-weight models, ~3B–35B, trainable in the cloud or on 12–32 GB NVIDIA cards.
#
# Fields
#   status:     verified   = official repo/announcement checked for license + size
#               partial    = official repo exists, some fields not yet confirmed
#               unverified = only secondhand claims, do not build on it yet
#   arch:       dense | moe | looped (layer-reuse) | hybrid
#   vram_*:     rough GB estimates (see docs/hardware.md). null = not estimated.
#               qlora  = 4-bit base + LoRA, seq ~2-4K, batch 1, grad checkpointing
#               lora   = bf16 base + LoRA, same settings
#               infer  = 4-bit inference incl. modest KV cache
#   checked:    date this entry was last checked against sources
#   tooling:    yes | likely | partial | no | '?'  (? = not checked yet)
#   gotchas:    known pitfalls
#   good_for:   publisher positioning / intended use, not our benchmark

- id: nanbeige4.2-3b
  name: Nanbeige4.2-3B
  publisher: Nanbeige LLM Lab (BOSS Zhipin)
  hf: https://huggingface.co/Nanbeige/Nanbeige4.2-3B
  base: https://huggingface.co/Nanbeige/Nanbeige4.2-3B-Base
  params_total: 4
  params_active: 3
  arch: looped
  modalities: text
  context: 262K
  license: Apache-2.0
  released: 2026-07
  vram_qlora: 8
  vram_lora: 14
  vram_infer: 4
  tags: [agentic, reasoning, small]
  notes: "3B non-embedding. Looped transformer (22 layers run twice per token). Needs trust_remote_code."
  tooling: {transformers: yes, mlx: partial, llamacpp: 'no', vllm: partial, sglang: partial}
  gotchas:
    - "Needs trust_remote_code in transformers."
    - "Stock mlx-lm has no 'nanbeige' model type yet (upstream PR pending); community MLX quants ship their own looped class."
    - "llama.cpp rejects the architecture; vLLM/SGLang only via forks."
    - "Each loop keeps its own KV cache, so long contexts cost about 2× the KV memory."
  good_for: "compact agentic reasoning; loop-count experiments"
  status: verified
  checked: 2026-11-24
  sources:
    - https://huggingface.co/papers/2607.22083

