name: validate
on:
  push:
    paths: ["docs/_data/**", "scripts/**"]
  pull_request:
    paths: ["docs/_data/**", "scripts/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/validate.py
